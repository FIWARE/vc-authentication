name: Check PR

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
    branches:
      - master

# One run per pull request: opening a pull request with a label fires two events at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:

  # Lints the charts and validates what they render, see https://github.com/SEAMWARE/github-workflows
  chart-lint:
    uses: SEAMWARE/github-workflows/.github/workflows/chart-lint.yml@main

  # Requires a semver label and bumps the version of the charts the pull request changes, see
  # https://github.com/SEAMWARE/github-workflows
  chart-version:
    needs:
      - chart-lint
    uses: SEAMWARE/github-workflows/.github/workflows/chart-pr.yml@main
    permissions:
      contents: write
      pull-requests: write
