postgres-operator:
  configKubernetes:
    enable_cross_namespace_secret: true

managedPostgres:
  enabled: true
  config:
    volume:
      storageClass: "local-path"
    users:
      keycloak.keycloak:
        - createdb
    databases:
      keycloak: keycloak.keycloak

vcverifier:
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: verifier.127.0.0.1.nip.io
        paths:
        - /
  deployment:
    verifier:
      tirAddress: http://tir.127.0.0.1.nip.io:8080/
      did: did:key:myverifier
      supportedModes: ["byValue","byReference"]
      clientIdentification:
        keyPath: /certificate/client.key.pem
        requestKeyAlgorithm: ES256
        id: x509_san_dns:provider-verifier.io
        certificatePath: /certificate/client-chain-bundle.cert.pem
    server:
      host: https://verifier.127.0.0.1.nip.io:8443
    configRepo:
      configEndpoint: http://credentials-config-service:8080
    additionalVolumes:
      - name: certificates
        secret:
          secretName: verifier-certs
      # add the self generated root ca to the system truststore
      - name: root-ca
        emptyDir: {}
    additionalVolumeMounts:
      - name: certificates
        mountPath: /certificate
      # add the self generated root ca to the system truststore
      - name: root-ca
        mountPath: /etc/ssl/cert.pem
        subPath: cert.pem
    initContainers:
      # add the self generated root ca to the system truststore
      - name: add-root-ca
        image: alpine:3.21.3
        command:
          - /bin/sh
        args:
          - -c
          - |
            #!/bin/sh
            cp /etc/ssl/cert.pem /root-ca/cert.pdata.typeem
            cat /root-ca/cacert.pem >> /root-ca/cert.pem
        volumeMounts:
          - name: root-ca
            mountPath: /root-ca
          - name: certificates
            mountPath: /root-ca/cacert.pem
            subPath: cacert.pem

trusted-issuers-list:
  ingress:
    tir:
      enabled: true
      className: nginx
      hosts:
        - host: tir.127.0.0.1.nip.io
    til:
      enabled: true
      className: nginx
      hosts:
        - host: til.127.0.0.1.nip.io

credentials-config-service:
  registration:
    enabled: true
    services:
      - id: data-service
        defaultOidcScope: "default"
        authorizationType: "FRONTEND_V2"
        oidcScopes:
          "default":
            credentials:
              - type: UserCredential
                trustedParticipantsLists: []
                trustedIssuersLists:
                  - http://trusted-issuers-list:8080
                jwtInclusion:
                  enabled: true
                  fullInclusion: true