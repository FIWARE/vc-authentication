# -- name to partially override common.names.name
nameOverride: ""
# -- name to fully override common.names.fullname
fullnameOverride: ""

## Installation of the postgres-operator - see https://github.com/zalando/postgres-operator
postgres-operator:
  # -- should the postgres-operator be installed
  enabled: true
  configKubernetes:
    enable_readiness_probe: true

## Usage of the postgres-operator - see https://github.com/zalando/postgres-operator
managedPostgres:
  # -- should it be enabled? Requires the postgres-operator CRDs to be installed before applying the chart
  enabled: true
  # -- config as defined in https://github.com/zalando/postgres-operator/blob/master/charts/postgres-operator/crds/postgresqls.yaml
  config:
    teamId: "vc-authentication"
    numberOfInstances: 1
    postgresql:
      version: "16"
    volume:
      size: 1Gi
    users:
      admin: # maintainer
        - superuser
        - createdb
      til:
        - createdb
      ccs:
        - createdb
    databases:
      tildb: til
      ccsdb: ccs
    patroni:
      pg_hba: # Allow connections without ssl as db is not exposed
        - local   all all           trust
        - hostssl all all 0.0.0.0/0 md5
        - host    all all 0.0.0.0/0 md5

# -- configuration for the trusted-issuers-list to be deployed as part of the vc-authentication, see https://github.com/FIWARE/helm-charts/tree/main/charts/trusted-issuers-list for all options
trusted-issuers-list:
  # -- should it be enabled? set to false if one outside the chart is used.
  enabled: true
  # -- allows to set a fixed name for the services
  fullnameOverride: trusted-issuers-list
  # -- connection to the database
  database:
    # -- should persistence be used?
    persistence: true
    # -- name of the db dialect
    dialect: POSTGRES
    # -- name of the db user
    username: til
    # -- configuration for the existing secret to get the passwords from
    existingSecret:
      enabled: true
      name: til.postgres.credentials.postgresql.acid.zalan.do
      key: password
    # -- host of the database
    host: postgres
    # -- host of the database
    port: 5432
    # -- name of the schema inside the db
    name: tildb

# -- configuration for the vcverifier to be deployed as part of the vc-authentication, see https://github.com/FIWARE/helm-charts/tree/main/charts/vcverifier for all options
vcverifier:
  # -- should it be enabled? set to false if one outside the chart is used.
  enabled: true
  # -- allows to set a fixed name for the services
  fullnameOverride: verifier
  deployment:
    # -- configuration for the m2m flow, in case the tir is requiring authentication
    m2m:
      # -- we do not need authentication here
      authEnabled: false
    database:
      type: postgres
      host: postgres
      name: ccsdb
      port: 5432
      existingSecret:
        name: ccs.postgres.credentials.postgresql.acid.zalan.do
        usernameKey: username
        passwordKey: password
    configRepo:
      configEndpoint: ''
    configServer:
      enabled: true
  # -- ingress configuration
  ingress:
    # -- should ingress be created
    enabled: true
    # -- ingress hosts configuration
    hosts:
      - host: my-verifier
        paths:
        - /
    # -- ingress tls configuration
    tls: []

# -- configuration for the credentials-config-service to be deployed as part of the vc-authentication, see https://github.com/FIWARE/helm-charts/tree/main/charts/credentials-config-service for all options
credentials-config-service:
  # -- should it be enabled? set to false if one outside the chart is used.
  enabled: false

# -- configuration for the digital-signature.service to be deployed as part of the connector in case of did:elsi support
dss:
  # -- should it be enabled?
  enabled: false
  # -- allows to set a fixed name for the services
  fullnameOverride: dss
  # -- can be used to provide the crl for ca's provided as truststore to the dss
  crl:
    # -- should it be enabled?
    enabled: false